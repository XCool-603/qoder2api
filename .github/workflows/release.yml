name: Release Desktop & Server Binaries

on:
  push:
    branches: ['main', 'master']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (empty = nightly)'
        required: false
        default: 'nightly'

permissions:
  contents: write

jobs:
  release:
    name: Build Cross-Platform Binaries
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Build Windows binaries (GUI + Console + ARM64)
        run: |
          go build -trimpath -ldflags "-H windowsgui -s -w" -o qoder2api.exe ./cmd/server
          go build -trimpath -ldflags "-s -w" -o qoder2api-console.exe ./cmd/server
          $env:CGO_ENABLED="0"; $env:GOOS="windows"; $env:GOARCH="arm64"; go build -trimpath -ldflags "-s -w" -o qoder2api-windows-arm64.exe ./cmd/server

      - name: Build Linux binaries
        run: |
          $env:CGO_ENABLED="0"; $env:GOOS="linux"; $env:GOARCH="amd64"; go build -trimpath -ldflags "-s -w" -o qoder2api-linux-amd64 ./cmd/server
          $env:CGO_ENABLED="0"; $env:GOOS="linux"; $env:GOARCH="arm64"; go build -trimpath -ldflags "-s -w" -o qoder2api-linux-arm64 ./cmd/server

      - name: Build macOS binaries
        run: |
          $env:CGO_ENABLED="0"; $env:GOOS="darwin"; $env:GOARCH="amd64"; go build -trimpath -ldflags "-s -w" -o qoder2api-darwin-amd64 ./cmd/server
          $env:CGO_ENABLED="0"; $env:GOOS="darwin"; $env:GOARCH="arm64"; go build -trimpath -ldflags "-s -w" -o qoder2api-darwin-arm64 ./cmd/server

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qoder2api-binaries
          path: |
            qoder2api.exe
            qoder2api-console.exe
            qoder2api-windows-arm64.exe
            qoder2api-linux-amd64
            qoder2api-linux-arm64
            qoder2api-darwin-amd64
            qoder2api-darwin-arm64
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || (inputs.release_tag != '' && inputs.release_tag || 'nightly') }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Qoder 2API Latest Build (Nightly)' }}
          draft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          files: |
            qoder2api.exe
            qoder2api-console.exe
            qoder2api-windows-arm64.exe
            qoder2api-linux-amd64
            qoder2api-linux-arm64
            qoder2api-darwin-amd64
            qoder2api-darwin-arm64
            config.example.json
          generate_release_notes: true
